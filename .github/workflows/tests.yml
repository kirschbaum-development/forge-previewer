name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        # PHP 8.5 is the current stable and our source/build floor.
        # Extend this matrix when 8.6 lands.
        php: ['8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, libxml, mbstring, openssl, pcntl, phar, posix, session, simplexml, sockets, tokenizer, xml, xmlreader, xmlwriter, zlib
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/pest
